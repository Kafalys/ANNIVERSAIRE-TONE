<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversaire TONE – Accès</title>
    <link rel="icon" href="images/LOGO.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="card" id="card">
    <img class="lock-icon" src="https://static-cdn.jtvnw.net/emoticons/v2/302234942/static/light/3.0" alt="">
    <h1>BONJOUR</h1>
    <p class="subtitle">Trouve le code pour entrer !</p>

    <div class="dots" id="dots"></div>

    <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key zero" onclick="pressKey('0')">0</button>
        <button class="key del" onclick="deleteKey()">⌫</button>
    </div>

    <p class="status" id="status"></p>
</div>

<script>
    const CODE = "12122021";
    let current = "";
    let locked = false;

    const dotsEl = document.getElementById('dots');
    for (let i = 0; i < CODE.length; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        d.id = 'dot-' + i;
        dotsEl.appendChild(d);
    }

    function updateDots() {
        for (let i = 0; i < CODE.length; i++)
            document.getElementById('dot-' + i).className = 'dot' + (i < current.length ? ' filled' : '');
    }

    function pressKey(digit) {
        if (locked || current.length >= CODE.length) return;
        current += digit;
        updateDots();
        if (current.length === CODE.length) setTimeout(checkCode, 150);
    }

    function deleteKey() {
        if (locked || current.length === 0) return;
        current = current.slice(0, -1);
        updateDots();
        setStatus('', '');
    }

    function checkCode() {
        if (current === CODE) {
            locked = true;
            for (let i = 0; i < CODE.length; i++)
                document.getElementById('dot-' + i).className = 'dot success';
            document.querySelector('.lock-icon').src = 'https://static-cdn.jtvnw.net/emoticons/v2/302234942/static/light/3.0';
            launchEmote();
            sessionStorage.setItem('tone_access', '1');
            setTimeout(() => { window.location.href = 'index.html'; }, 2200);
        } else {
            for (let i = 0; i < CODE.length; i++)
                document.getElementById('dot-' + i).className = 'dot error';
            setStatus('Code incorrect, réessaie !', 'error');
            const card = document.getElementById('card');
            card.classList.add('shake');
            card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
            setTimeout(() => { current = ""; updateDots(); setStatus('', ''); }, 900);
        }
    }

    function setStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = 'status ' + type;
    }

    function launchEmote() {
        const img = document.createElement('img');
        img.className = 'emote-celebration';
        img.src = 'https://static-cdn.jtvnw.net/emoticons/v2/301022884/static/light/3.0';
        document.body.appendChild(img);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        if (e.key === 'Backspace') deleteKey();
    });
</script>
</body>
</html>
